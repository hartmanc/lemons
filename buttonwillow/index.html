const DRIVERS = {
  Sarah:  {name:"Sarah",  c:"--s1", note:"Rookie", noteTitle:"Sarah's 3rd race"},
  Thomas: {name:"Thomas", c:"--s2"},
  Coby:   {name:"Coby",   c:"--s3"},
  Pablo:  {name:"Pablo",  c:"--s4"},
  Elias:  {name:"Elias",  c:"--s5"},
};
// One entry per stint. Each driver-change lap (over 7:00) starts the next stint.
const STINTS = [
  {driver:"Sarah",  day:1, from:1,    to:27},
  {driver:"Thomas", day:1, from:28,   to:59},
  {driver:"Coby",   day:1, from:60,   to:93},
  {driver:"Pablo",  day:1, from:94,   to:126},
  {driver:"Elias",  day:1, from:127,  to:158},
  {driver:"Sarah",  day:2, from:159,  to:183},
  {driver:"Thomas", day:2, from:184,  to:208},
  {driver:"Elias",  day:2, from:209,  to:237},
  {driver:"Pablo",  day:2, from:238,  to:262},
  {driver:"Coby",   day:2, from:263,  to:null, live:true},
];
const PIT = 420, SIGMAS = 2, FIELD = 105, FINISHED = true;

const parseT = s => { const [m,r] = s.split(":"); return +m*60 + +r; };
const fmt = t => { const m = Math.floor(t/60), s = t - m*60; return m + ":" + s.toFixed(3).padStart(6,"0"); };
const fmtShort = t => fmt(t).slice(0, fmt(t).length-2);
const laps = RAW.trim().split("\n").map(l => { const [n,t,p,f] = l.trim().split(/\s+/); return {lap:+n, t:parseT(t), pos:+p, yellow:f==="Y", check:f==="C", overnight:f==="O", red:f==="R", black:f==="B", change:f==="D", start:f==="S"}; });
laps.forEach(l => { l.pit = l.change || (!l.overnight && !l.red && !l.black && l.t > PIT); });

const lastLap = laps[laps.length-1].lap;
STINTS.forEach(s => {
  Object.assign(s, DRIVERS[s.driver]);
  if (s.to == null && s.live) s.to = lastLap;
});
const stintOf = lap => STINTS.find(s => s.to != null && lap >= s.from && lap <= s.to);
laps.forEach(l => { l.driver = stintOf(l.lap); });
const excluded = l => l.yellow || l.pit || l.check || l.overnight || l.red || l.black || l.start;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const slowToggle = document.getElementById("slowToggle");
const blackToggle = document.getElementById("blackToggle");
try { const v = localStorage.getItem("countBlack"); if (v != null) blackToggle.checked = v === "1"; } catch(e) {}
try { const v = localStorage.getItem("dropOutliers"); if (v != null) slowToggle.checked = v === "1"; } catch(e) {}

const meanOf = ls => ls.length ? ls.reduce((a,l)=>a+l.t,0)/ls.length : null;
const sdOf = ls => { const m = meanOf(ls); return ls.length > 1 ? Math.sqrt(ls.reduce((a,l)=>a+(l.t-m)**2,0)/(ls.length-1)) : null; };

// Outliers are judged per stint, since conditions change between stints and days.
function stats(st, dropSlow){
  const mine = laps.filter(l => l.driver === st);
  const clean = mine.filter(l => !excluded(l));
  const cut = meanOf(clean) + SIGMAS*(sdOf(clean) ?? 0);
  mine.forEach(l => { l.outlier = !excluded(l) && clean.length > 2 && l.t > cut; });
  // Black-flag laps are the driver's own time lost, so they can count toward the
  // average. They never set the outlier cut and are never dropped as outliers.
  const black = blackToggle.checked ? mine.filter(l => l.black) : [];
  const counted = (dropSlow ? clean.filter(l => !l.outlier) : clean).concat(black);
  // Stint time: every lap in the stint, driver-change lap included.
  const secs = mine.filter(l => !l.overnight).reduce((a,l)=>a+l.t,0);
  const best = mine.length ? Math.min(...mine.map(l=>l.t)) : null;
  return {d: st, mine, counted, avg: meanOf(counted), sd: sdOf(counted), best, secs,
          partial: mine.some(l=>l.overnight) || (st.live && !FINISHED)};
}

function render(){
  const dropSlow = slowToggle.checked;
  const S = STINTS.map(st => stats(st, dropSlow));
  // Driver totals pool the counted laps from all of that driver's stints.
  const D = Object.values(DRIVERS).map(d => {
    const ss = S.filter(s => s.d.driver === d.name);
    const counted = ss.flatMap(s => s.counted), mine = ss.flatMap(s => s.mine);
    return {d, stints: ss, counted, mine, avg: meanOf(counted), sd: sdOf(counted),
            best: mine.length ? Math.min(...mine.map(l=>l.t)) : null};
  });
  const bestAvg = Math.min(...D.filter(x=>x.avg!=null).map(x=>x.avg));
  const allBest = laps.reduce((a,l)=> l.t<a.t?l:a);
  const live = STINTS.find(s=>s.live);
  const lastL = laps[laps.length-1];

  document.getElementById("meta").innerHTML =
    `${FINISHED ? "Final" : "Day 2 · Lap "+lastLap} · P${lastL.pos} of ${FIELD}${FINISHED ? " · P7 in class B" : ""} · ${lastLap} laps<br>Best ${fmt(allBest.t)} (L${allBest.lap}, ${allBest.driver.name})`;

  document.getElementById("tiles").innerHTML = D.map(x => {
    const d = x.d;
    const tag = '<span class="tags">' + [
      live && live.driver === d.name && (FINISHED ? '<span class="pill fast">Finished</span>' : '<span class="pill live">In car</span>'),
      d.note && `<span class="pill fast" title="${d.noteTitle||""}">${d.note}</span>`,
      x.avg!=null && x.avg===bestAvg && '<span class="pill fast">Fastest avg</span>',
      x.best!=null && x.best===allBest.t && '<span class="pill fast">Fastest lap</span>',
    ].filter(Boolean).join("") + '</span>';
    const avg = x.avg!=null ? `<div class="avg">${fmt(x.avg)}</div>` : `<div class="avg none">No laps logged</div>`;
    const delta = x.avg!=null && x.avg!==bestAvg ? `+${(x.avg-bestAvg).toFixed(3)}s` : (x.avg!=null ? "—" : "");
    const stintRows = x.stints.map(s => {
      const range = `L${s.d.from}–${s.d.live && !FINISHED ? s.d.to+"+" : s.d.to}`;
      const time = `${(s.secs/60).toFixed(0)}${s.partial?"+":""} min`;
      const a = s.avg!=null ? fmtShort(s.avg) : "—";
      return `<div class="stint"><span>Day ${s.d.day} · ${range}</span><b>${a} · ${time}</b></div>`;
    }).join("");
    return `<article class="tile" style="--c:var(${d.c})">
      <div class="name">${d.name}${tag}</div>
      <div class="label">Avg lap · ${x.stints.length > 1 ? "both days" : "day 1"}</div>
      ${avg}
      <div class="stints"><div class="dl-head">Stints · avg · time</div>${stintRows}</div>
      <dl>
        ${x.avg!=null ? `<dt>Best</dt><dd>${fmt(x.best)}</dd>
        <dt>Consistency (σ)</dt><dd>${x.sd.toFixed(2)}s</dd>
        <dt>Laps counted</dt><dd>${x.counted.length} / ${x.mine.length}</dd>
        <dt>Gap to fastest</dt><dd>${delta}</dd>` : ""}
      </dl>
    </article>`;
  }).join("");

  document.getElementById("legend").innerHTML =
    Object.values(DRIVERS).map(d=>`<span><i class="sw" style="--c:var(${d.c})"></i>${d.name}</span>`).join("") +
    `<span><i class="sw dash"></i>Stint average</span><span><i class="sw yf"></i>Double yellow</span><span><i class="sw rf"></i>Red flag</span><span><i class="sw bf"></i>Black flag</span><span><i class="sw ol"></i>Outlier (dropped)</span>`;

  drawChart(S, dropSlow);
  drawDist(D);
  document.getElementById("notes").innerHTML =
    `<div>Averages leave out the start lap, double-yellow laps, the red-flag lap (${laps.filter(l=>l.red).map(l=>l.lap).join(", ")}), ${blackToggle.checked ? "" : `the black-flag laps (${laps.filter(l=>l.black).map(l=>l.lap).join(", ")}), `}the overnight lap, and driver-change laps (${laps.filter(l=>l.pit).map(l=>l.lap).join(", ")}). Laps over 4:00 are drawn at the top of the chart${dropSlow?". Outlier laps are also dropped: anything more than 2 standard deviations slower than the mean for that stint (hollow markers). Dropped: "+laps.filter(l=>l.outlier).map(l=>l.lap).join(", "):""}.</div>
     <div>Lap times and positions are the official MYLAPS results. Stint time adds up each stint's laps, starting with the driver-change lap. + means part of the stint is inside the overnight lap${FINISHED ? "" : " or still running"}.</div>`;

  // Table
  document.getElementById("tbl").innerHTML = `<thead><tr><th>Lap</th><th>Pos</th><th>Driver</th><th>Time</th><th>Note</th></tr></thead><tbody>` +
    laps.slice().reverse().map(l=>`<tr class="${l.yellow?"yel":""} ${l.pit||l.overnight?"pit":""} ${l.red?"red":""} ${l.black?"pit":""}"><td>${l.lap}</td><td>${l.pos}</td><td>${l.driver.name}</td><td>${fmt(l.t)}</td><td>${l.overnight?"Overnight":l.red?"Red flag (Pinto rollover, Star Mazda)":l.black?"Black flag":l.pit?"Driver change":l.check?"Checkered (under double yellow)":l.start?"Start":l.yellow?"Double yellow":l.outlier?"Outlier (>2σ)":l.t===allBest.t?"Best":""}</td></tr>`).join("") + `</tbody>`;
}

function drawChart(S, dropSlow){
  const host = document.getElementById("chart");
  const W = Math.max(320, host.clientWidth), ih = W < 600 ? 270 : 350;
  const m = {l:48, r:12, t:58, b:30};
  const iw = W-m.l-m.r;
  // Overall position panel sits under the lap-time panel on the same lap axis.
  const FIELD = 105, pTop = m.t+ih+34, pH = W < 600 ? 100 : 120, H = pTop+pH+m.b;
  const P = pos => pTop + (pos-1)/(FIELD-1)*pH;
  const bands = [[m.t, ih], [pTop, pH]];
  const x0 = 1, x1 = Math.max(lastLap+6, 140);
  const yMin = 145, yMax = 240; // 2:25 – 4:00, anything slower is capped
  const X = n => m.l + (n-x0)/(x1-x0)*iw;
  const Y = t => m.t + (1 - (Math.min(t,yMax)-yMin)/(yMax-yMin))*ih;
  const grid = css("--grid"), ink3 = css("--ink-3"), ink2 = css("--ink-2"), panel = css("--panel"), yel = css("--yellow");
  let g = "";
  // stint bands
  S.forEach(({d})=>{
    if (d.from==null || d.to==null) return;
    const xa = X(d.from-0.5), xb = X(d.to+0.5);
    bands.forEach(([y,h])=>{ g += `<rect x="${xa}" y="${y}" width="${xb-xa}" height="${h}" fill="${css(d.c)}" fill-opacity="${css("--band-a")}"/>`; });
    g += `<line x1="${xa}" x2="${xa}" y1="${m.t-26}" y2="${m.t+ih}" stroke="${css(d.c)}" stroke-width="2"/>`;
    g += `<line x1="${xa}" x2="${xa}" y1="${pTop}" y2="${pTop+pH}" stroke="${css(d.c)}" stroke-width="2"/>`;
  });
  // day labels
  [1,2].forEach(day => {
    const st = STINTS.find(s => s.day === day && s.to != null);
    if (st) g += `<text class="plab" x="${X(day===1 ? 0.5 : st.from-0.5)+(day===1?0:6)}" y="${m.t-36}">Day ${day}</text>`;
  });
  // yellow bands
  laps.filter(l=>l.yellow).forEach(l=>{
    bands.forEach(([y,h])=>{ g += `<rect x="${X(l.lap-0.5)}" y="${y}" width="${X(l.lap+0.5)-X(l.lap-0.5)}" height="${h}" fill="url(#yhatch)"/>`; });
  });
  const ygroups = [];
  laps.filter(l=>l.yellow).forEach(l=>{ const gp = ygroups[ygroups.length-1]; if (gp && l.lap-gp[1] <= 2) gp[1] = l.lap; else ygroups.push([l.lap,l.lap]); });
  // red flag laps
  laps.filter(l=>l.red).forEach(l=>{
    const cx = (X(l.lap-0.5)+X(l.lap+0.5))/2;
    bands.forEach(([y,h])=>{ g += `<rect x="${X(l.lap-0.5)}" y="${y}" width="${X(l.lap+0.5)-X(l.lap-0.5)}" height="${h}" fill="url(#rhatch)"/>`; });
    g += `<text class="ylab" style="fill:var(--red-ink)" x="${cx}" y="${m.t+ih-6}" text-anchor="middle"><tspan x="${cx}" dy="-14">RED</tspan><tspan x="${cx}" dy="14">FLAG</tspan></text>`;
  });
  // black flag laps
  // nearby black flags share one label so they don't collide
  const bgroups = [];
  laps.filter(l=>l.black).forEach(l=>{
    bands.forEach(([y,h])=>{ g += `<rect x="${X(l.lap-0.5)}" y="${y}" width="${X(l.lap+0.5)-X(l.lap-0.5)}" height="${h}" fill="url(#bhatch)"/>`; });
    const gp = bgroups[bgroups.length-1];
    if (gp && l.lap - gp[gp.length-1] <= 20) gp.push(l.lap); else bgroups.push([l.lap]);
  });
  bgroups.forEach(gp=>{
    const cx = (X(gp[0])+X(gp[gp.length-1]))/2;
    g += `<text class="ylab" style="fill:var(--ink)" x="${cx}" y="${m.t+ih-6}" text-anchor="middle"><tspan x="${cx}" dy="-14">BLACK</tspan><tspan x="${cx}" dy="14">FLAG${gp.length>1?"S":""}</tspan></text>`;
  });
  ygroups.forEach(([a,b])=>{ g += `<text class="ylab" x="${(X(a-0.5)+X(b+0.5))/2}" y="${m.t+ih-6}" text-anchor="middle"><tspan x="${(X(a-0.5)+X(b+0.5))/2}" dy="-14">DOUBLE</tspan><tspan x="${(X(a-0.5)+X(b+0.5))/2}" dy="14">YELLOW</tspan></text>`; });
  // checkered lap
  laps.filter(l=>l.check).forEach(l=>{
    bands.forEach(([y,h])=>{ g += `<rect x="${X(l.lap-0.5)}" y="${y}" width="${X(l.lap+0.5)-X(l.lap-0.5)}" height="${h}" fill="url(#checker)"/>`; });
    g += `<text class="ylab" style="fill:var(--ink-2)" x="${X(l.lap+0.5)}" y="${m.t+ih+14}" text-anchor="end">FINISH</text>`;
  });
  // y grid
  for (let t=150; t<=yMax; t+=15){
    g += `<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(t)}" y2="${Y(t)}" stroke="${grid}"/>`;
    g += `<text x="${m.l-6}" y="${Y(t)+4}" text-anchor="end">${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}${t===yMax?"+":""}</text>`;
  }
  // position panel grid
  g += `<text class="plab" x="${m.l}" y="${pTop-10}">Overall position · of ${FIELD} cars</text>`;
  [1,25,50,75,105].forEach(p=>{
    g += `<line x1="${m.l}" x2="${m.l+iw}" y1="${P(p)}" y2="${P(p)}" stroke="${grid}"/>`;
    g += `<text x="${m.l-6}" y="${P(p)+4}" text-anchor="end">P${p}</text>`;
  });
  // x ticks
  const step = W<600 ? 20 : 10;
  for (let n=step; X(n) < m.l+iw-36; n+=step){
    g += `<line x1="${X(n)}" x2="${X(n)}" y1="${pTop+pH}" y2="${pTop+pH+4}" stroke="${ink3}"/>`;
    g += `<text x="${X(n)}" y="${pTop+pH+17}" text-anchor="middle">${n}</text>`;
  }
  g += `<text x="${m.l+iw}" y="${pTop+pH+17}" text-anchor="end">lap</text>`;
  g += `<line x1="${m.l}" x2="${m.l+iw}" y1="${m.t+ih}" y2="${m.t+ih}" stroke="${ink3}"/>`;
  g += `<line x1="${m.l}" x2="${m.l+iw}" y1="${pTop+pH}" y2="${pTop+pH}" stroke="${ink3}"/>`;
  // lines per stint, broken at missing laps
  S.forEach(({d, mine})=>{
    let path = "", prev = null;
    mine.forEach(l=>{
      path += (prev!=null && l.lap===prev+1 ? "L" : "M") + X(l.lap).toFixed(1)+","+Y(l.t).toFixed(1);
      prev = l.lap;
    });
    if (path) g += `<path d="${path}" fill="none" stroke="${css(d.c)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    let pp = ""; prev = null;
    mine.forEach(l=>{ pp += (prev!=null && l.lap===prev+1 ? "L" : "M") + X(l.lap).toFixed(1)+","+P(l.pos).toFixed(1); prev = l.lap; });
    if (pp) g += `<path d="${pp}" fill="none" stroke="${css(d.c)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    mine.filter(l=>l.t>yMax).forEach(l=>{
      g += `<path d="M${X(l.lap)-5},${Y(l.t)+2}L${X(l.lap)+5},${Y(l.t)+2}L${X(l.lap)},${Y(l.t)-5}Z" fill="${css(d.c)}" stroke="${panel}" stroke-width="2"/>`;
    });
  });
  // outlier markers
  if (dropSlow) laps.filter(l=>l.outlier && l.t<=yMax).forEach(l=>{
    g += `<circle cx="${X(l.lap)}" cy="${Y(l.t)}" r="4.5" fill="${panel}" stroke="${css(l.driver.c)}" stroke-width="2"/>`;
  });
  // yellow lap markers
  laps.filter(l=>l.yellow).forEach(l=>{
    g += `<circle cx="${X(l.lap)}" cy="${Y(l.t)}" r="4.5" fill="${yel}" stroke="${panel}" stroke-width="2"/>`;
  });
  // averages + direct labels
  S.forEach(({d, avg})=>{
    if (d.from==null || d.to==null) return;
    const xa = X(d.from-0.5)+6;
    g += `<text class="dlab" x="${xa}" y="${m.t-12}">${d.name}</text>`;
    if (avg==null) return;
    const xs = X(d.from-0.5), xe = X(d.to+0.5);
    g += `<line x1="${xs}" x2="${xe}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="${ink2}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    const lx = Math.max(xs+4, m.l+4);
    g += `<text class="alab" x="${lx}" y="${Y(avg)-6}" paint-order="stroke" stroke="${panel}" stroke-width="4">${W<600?fmt(avg).slice(0,6):"avg "+fmt(avg)}</text>`;
  });
  const lastL = laps[laps.length-1];
  g += `<circle cx="${X(lastL.lap)}" cy="${P(lastL.pos)}" r="4" fill="${css(lastL.driver.c)}" stroke="${panel}" stroke-width="2"/>`;
  g += `<text class="alab" x="${X(lastL.lap)-8}" y="${P(lastL.pos)-8}" text-anchor="end" paint-order="stroke" stroke="${panel}" stroke-width="4">P${lastL.pos}</text>`;
  const firstL = laps[0];
  g += `<text class="alab" x="${X(firstL.lap)+8}" y="${P(firstL.pos)+14}" paint-order="stroke" stroke="${panel}" stroke-width="4">P${firstL.pos}</text>`;
  // hover layer
  g += `<circle id="xp" r="4" fill="${panel}" stroke-width="2.5" visibility="hidden"/>`;
  g += `<line id="xh" y1="${m.t}" y2="${pTop+pH}" stroke="${ink2}" stroke-width="1" visibility="hidden"/>`;
  g += `<circle id="xd" r="5" fill="${panel}" stroke-width="2.5" visibility="hidden"/>`;
  g += `<rect id="hit" x="${m.l}" y="${m.t-30}" width="${iw}" height="${pTop+pH-m.t+30}" fill="transparent"/>`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lap time and overall position by lap, colored by driver stint">
    <defs>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.5" height="6" fill="${grid}"/></pattern>
      <pattern id="checker" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="${ink2}" fill-opacity=".5"/><rect x="3" y="3" width="3" height="3" fill="${ink2}" fill-opacity=".5"/></pattern>
      <pattern id="bhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="6" fill="${ink2}" fill-opacity=".45"/></pattern>
      <pattern id="rhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="6" fill="${css("--red")}" fill-opacity=".45"/></pattern>
      <pattern id="yhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="6" fill="${yel}" fill-opacity=".45"/></pattern>
    </defs>${g}</svg><div class="tip" hidden></div>`;
  const svg = host.querySelector("svg"), tip = host.querySelector(".tip"),
        xh = svg.getElementById("xh"), xd = svg.getElementById("xd"), xp = svg.getElementById("xp");
  const byLap = new Map(laps.map(l=>[l.lap,l]));
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    let n = Math.round(x0 + (sx-m.l)/iw*(x1-x0)), l = byLap.get(n);
    if (!l) { let best=null; laps.forEach(q=>{ if(best==null||Math.abs(q.lap-n)<Math.abs(best.lap-n)) best=q; }); l = Math.abs(best.lap-n)<=1 ? best : null; }
    if (!l) { hide(); return; }
    const cx = X(l.lap), cy = Y(l.t);
    xh.setAttribute("x1",cx); xh.setAttribute("x2",cx); xh.setAttribute("visibility","visible");
    xd.setAttribute("cx",cx); xd.setAttribute("cy",cy); xd.setAttribute("stroke",css(l.driver.c)); xd.setAttribute("visibility","visible");
    xp.setAttribute("cx",cx); xp.setAttribute("cy",P(l.pos)); xp.setAttribute("stroke",css(l.driver.c)); xp.setAttribute("visibility","visible");
    tip.hidden = false;
    tip.style.left = Math.min(Math.max(cx/W*r.width, 80), r.width-80)+"px";
    tip.style.top = (cy/H*r.height)+"px";
    tip.innerHTML = `<b>Lap ${l.lap} · ${l.driver.name}</b><br>${fmt(l.t)} · P${l.pos}${l.yellow?" · double yellow":""}${l.pit?" · driver change":""}${l.red?" · red flag":""}${l.black?" · black flag":""}${l.overnight?" · overnight":""}${l.check?" · checkered":""}`;
  };
  const hide = () => { tip.hidden = true; xh.setAttribute("visibility","hidden"); xd.setAttribute("visibility","hidden"); xp.setAttribute("visibility","hidden"); };
  const hit = svg.getElementById("hit");
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move); hit.addEventListener("pointerleave", hide);
}

function drawDist(S){
  const host = document.getElementById("dist");
  const rows = S.filter(s => s.counted.length > 1);
  const W = Math.max(320, host.clientWidth), narrow = W < 600;
  const m = {l: narrow ? 70 : 92, r:14, t:8, b:30}, rowH = narrow ? 64 : 76, gap = 10;
  const iw = W-m.l-m.r, H = m.t + rows.length*(rowH+gap) - gap + m.b;
  const all = rows.flatMap(s => s.counted.map(l=>l.t));
  const BIN = 1, CAP = 215; // bins past 3:35 collapse into one overflow bin
  const lo = Math.floor(Math.min(...all)) - 1, hi = Math.min(CAP, Math.ceil(Math.max(...all))) + 1;
  const X = t => m.l + (Math.min(t,hi)-lo)/(hi-lo)*iw;
  const grid = css("--grid"), ink3 = css("--ink-3"), ink2 = css("--ink-2"), panel = css("--panel");
  const nb = Math.ceil((hi-lo)/BIN);
  const hists = rows.map(s => { const h = new Array(nb).fill(0); s.counted.forEach(l => { h[Math.min(nb-1, Math.floor((Math.min(l.t,hi-0.001)-lo)/BIN))]++; }); return h; });
  const maxC = Math.max(...hists.flat());
  let g = "";
  const tstep = narrow ? 10 : 5;
  for (let t = Math.ceil(lo/tstep)*tstep; t <= hi; t += tstep){
    g += `<line x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${H-m.b}" stroke="${grid}"/>`;
    g += `<text x="${X(t)}" y="${H-m.b+17}" text-anchor="middle">${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}${t>=hi-1?"+":""}</text>`;
  }
  rows.forEach((s, i) => {
    const top = m.t + i*(rowH+gap), base = top + rowH, c = css(s.d.c);
    const Yc = n => base - n/maxC*(rowH-14);
    g += `<text class="rlab" x="${m.l-10}" y="${top+rowH/2}" text-anchor="end">${s.d.name}</text>`;
    g += `<text x="${m.l-10}" y="${top+rowH/2+15}" text-anchor="end">${s.counted.length} laps</text>`;
    hists[i].forEach((n, b) => {
      if (!n) return;
      const x0 = X(lo+b*BIN)+1, x1 = X(lo+(b+1)*BIN)-1, y = Yc(n);
      const t0 = lo+b*BIN, lab = b===nb-1 && hi>=CAP ? `${fmt(t0).slice(0,4)}+` : `${fmt(t0).slice(0,4)}–${fmt(t0+BIN).slice(0,4)}`;
      g += `<path d="M${x0},${base}V${y+2}q0,-2 2,-2H${x1-2}q2,0 2,2V${base}Z" fill="${c}" fill-opacity=".45"><title>${s.d.name}: ${n} lap${n>1?"s":""} at ${lab}</title></path>`;
    });
    // normal fit scaled to counts per bin
    const n = s.counted.length, mu = s.avg, sd = Math.max(s.sd, 0.3);
    let d = "";
    for (let px = 0; px <= iw; px += 2){
      const t = lo + px/iw*(hi-lo);
      const f = n*BIN*Math.exp(-0.5*((t-mu)/sd)**2)/(sd*Math.sqrt(2*Math.PI));
      d += (px ? "L" : "M") + (m.l+px).toFixed(1) + "," + Math.max(top, Yc(f)).toFixed(1);
    }
    g += `<path d="${d}" fill="none" stroke="${c}" stroke-width="2"/>`;
    g += `<line x1="${X(mu)}" x2="${X(mu)}" y1="${top+4}" y2="${base}" stroke="${ink2}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    const right = X(mu) > m.l + iw*0.6;
    g += `<text class="mlab" x="${X(mu) + (right?-6:6)}" y="${top+14}" text-anchor="${right?"end":"start"}" paint-order="stroke" stroke="${panel}" stroke-width="4">${fmt(mu).slice(0,6)} · σ ${s.sd.toFixed(1)}s</text>`;
    g += `<line x1="${m.l}" x2="${m.l+iw}" y1="${base}" y2="${base}" stroke="${ink3}"/>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lap time histograms per driver on a shared lap-time axis">${g}</svg>`;
}

blackToggle.addEventListener("change", ()=>{ try{localStorage.setItem("countBlack", blackToggle.checked?"1":"0");}catch(e){} render(); });
slowToggle.addEventListener("change", ()=>{ try{localStorage.setItem("dropOutliers", slowToggle.checked?"1":"0");}catch(e){} render(); });
let rt; new ResizeObserver(()=>{ clearTimeout(rt); rt=setTimeout(render,60); }).observe(document.getElementById("chart"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
render();
</script>
